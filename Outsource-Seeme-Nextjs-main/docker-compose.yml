# Lung Vai Tea - Frontend##   cp .env.docker.example .env   -> điền giá trị thật#   docker compose up -d --build  -> build + chạy#   docker compose logs -f        -> xem log#   docker compose down           -> dừng## LƯU Ý: mọi biến NEXT_PUBLIC_* được nhúng vào bundle JS lúc BUILD.# Đổi NEXT_PUBLIC_API_URL (hay bất kỳ biến NEXT_PUBLIC_ nào) => phải build lại:#   docker compose up -d --buildservices:  frontend:    build:      context: .      dockerfile: Dockerfile      args:        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}        NEXT_PUBLIC_PATH: ${NEXT_PUBLIC_PATH:-}        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?can NEXT_PUBLIC_API_URL trong file .env}        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-}        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}        NEXT_PUBLIC_SERVER_IP: ${NEXT_PUBLIC_SERVER_IP:-}        NEXT_PUBLIC_COOKIE_DOMAINS: ${NEXT_PUBLIC_COOKIE_DOMAINS:-}        NEXT_PUBLIC_MAP4D_ACCESS_KEY: ${NEXT_PUBLIC_MAP4D_ACCESS_KEY:-}        NEXT_PUBLIC_MAP4D_VERSION: ${NEXT_PUBLIC_MAP4D_VERSION:-2.3}        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}        NEXT_PUBLIC_CMS_ADMIN_PHONE: ${NEXT_PUBLIC_CMS_ADMIN_PHONE:-}        NEXT_PUBLIC_VIDEO_ASSET_BASE_URL: ${NEXT_PUBLIC_VIDEO_ASSET_BASE_URL:-}        NEXT_PUBLIC_HOME_BANNER_VIDEO_DESKTOP: ${NEXT_PUBLIC_HOME_BANNER_VIDEO_DESKTOP:-}        NEXT_PUBLIC_HOME_BANNER_VIDEO_MOBILE: ${NEXT_PUBLIC_HOME_BANNER_VIDEO_MOBILE:-}        NEXT_PUBLIC_HOME_BANNER_POSTER_DESKTOP: ${NEXT_PUBLIC_HOME_BANNER_POSTER_DESKTOP:-}        NEXT_PUBLIC_HOME_BANNER_POSTER_MOBILE: ${NEXT_PUBLIC_HOME_BANNER_POSTER_MOBILE:-}        NEXT_PUBLIC_USD_VND_EXCHANGE_RATE: ${NEXT_PUBLIC_USD_VND_EXCHANGE_RATE:-25400}        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}        NEXT_PUBLIC_BOOKING_URL: ${NEXT_PUBLIC_BOOKING_URL:-}    image: lungvaitra-frontend:${IMAGE_TAG:-latest}    container_name: lungvaitra-frontend    restart: unless-stopped    # Dùng Nginx trên host làm reverse proxy -> đặt APP_BIND=127.0.0.1    # để container không lộ thẳng ra Internet. Mặc định 0.0.0.0 (test nhanh).    ports:      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"    environment:      # Biến chạy phía server (KHÔNG nhúng vào JS, đổi xong chỉ cần restart)      TZ: ${TZ:-Asia/Ho_Chi_Minh}      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}    healthcheck:      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]      interval: 30s      timeout: 5s      retries: 3      start_period: 45s    logging:      driver: json-file      options:        max-size: "10m"        max-file: "3"    networks:      - lungvaitranetworks:  lungvaitra:    driver: bridge